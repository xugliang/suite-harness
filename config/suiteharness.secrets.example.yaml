# 复制为 config/suiteharness.secrets.yaml。Linux 上必须 chmod 600。
# 真实文件已被 .gitignore 排除，严禁提交仓库。
config_version: 1

web:
  web/default:
    # 至少 32 个字符；生产环境使用密码学随机值并定期轮换。
    session_signing_key: replace-with-a-long-random-company-server-secret

feishu:
  feishu/default:
    app_secret: replace-with-feishu-app-secret
    # Webhook 模式必须同时配置下列两项；长连接模式可省略。
    verification_token: replace-with-feishu-verification-token
    encrypt_key: replace-with-feishu-encrypt-key

model_providers:
  model/deepseek:
    api_key: replace-with-deepseek-api-key

services:
  search/baidu-qianfan:
    token: replace-with-baidu-qianfan-token
