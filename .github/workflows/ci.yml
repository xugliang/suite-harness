name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install declared dependencies (source-checkout mode)
        run: python -c "import pathlib, subprocess, sys, tomllib; data=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); deps=data['project']['dependencies'] + data['project']['optional-dependencies']['dev']; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest --basetemp=.pytest-tmp-ci

  distribution:
    name: Build and inspect distribution / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build frontend
        run: python -m pip install --upgrade pip "build>=1.2"

      - name: Build wheel and source distribution
        run: python -m build --outdir dist .

      - name: Inspect distribution contents and metadata
        run: python scripts/check_distributions.py dist

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suite-harness-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
