name: ${SUITE_POSTGRES_PROJECT:-suite-product-data}

# Optional standalone template. Existing database environments configure a DSN
# instead of starting this service. Never run a second instance on occupied 5433.
services:
  postgres:
    image: postgres:17
    profiles: [standalone-postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUITE_POSTGRES_ADMIN_USER:-suite_db_owner}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${SUITE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - type: bind
        source: ${SUITE_POSTGRES_DATA_DIR:?Set an absolute private data directory outside the source repository}
        target: /var/lib/postgresql/data
    secrets:
      - postgres_admin_password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s
    command: [postgres, -c, max_connections=100, -c, timezone=Asia/Shanghai]

secrets:
  postgres_admin_password:
    file: ${SUITE_POSTGRES_PASSWORD_FILE:?Set an absolute private secret-file path outside the source repository}
