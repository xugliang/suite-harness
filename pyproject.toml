[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "suite-harness"
version = "0.1.0"
description = "Composable, scoped runtime building blocks for AI agent products"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai-agents", "harness", "multi-tenant", "plugins", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "packaging>=24.0",
    "httpx>=0.27,<1",
    "PyYAML>=6.0",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.30,<1",
    "regex>=2024.5.15",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
google = [
    "google-auth>=2.29",
]
all-model-providers = [
    "boto3>=1.34",
    "google-auth>=2.29",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/suiteharness"]

[tool.hatch.build]
exclude = [
    "/.testdeps",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]
